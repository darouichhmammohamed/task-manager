
<section class="task-list">
  <div class="task-filters" aria-label="Filter tasks">
    <button
      type="button"
      [class.active]="filter() === 'all'"
      [attr.aria-pressed]="filter() === 'all'"
      (click)="setFilter('all')"
    >
      All
    </button>
    <button
      type="button"
      [class.active]="filter() === 'active'"
      [attr.aria-pressed]="filter() === 'active'"
      (click)="setFilter('active')"
    >
      Active
    </button>
    <button
      type="button"
      [class.active]="filter() === 'completed'"
      [attr.aria-pressed]="filter() === 'completed'"
      (click)="setFilter('completed')"
    >
      Completed
    </button>
  </div>

  @for (task of fileterTasks(); track task.id) {
    <article class="task-item">
      <div class="task-content">
        <h3>
          <a [routerLink]="['/task', task.id]">{{ task.title }}</a>
        </h3>
        <p>{{ task.description }}</p>
        <small>Created: {{ task.createdAt }}</small>
        <button class="task-delete-button" (click)="deleteTask(task.id)">Delete task</button>
    </div>
    </article>
  } @empty {
    @if (filter() === 'all') {
      <p class="empty-task-list">There are no tasks yet.</p>
    } @else {
      <p class="empty-task-list">No {{ filter() }} tasks found.</p>
    }
  }
</section>
